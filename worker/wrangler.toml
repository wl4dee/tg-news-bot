name = "tg-news-bot"
main = "src/index.js"
compatibility_date = "2025-01-01"

# CHANNEL_ID не секрет. Для ПУБЛІЧНОГО каналу Telegram приймає @username
# замість числового id — тому числовий id тут не потрібен узагалі.
# Якщо колись зробиш канал приватним, заміни на id виду -1001234567890.
[vars]
CHANNEL_ID = "@wladee_news"

# id береться з `npx wrangler kv namespace create NEWSBOT`.
# Назва NEWSBOT важлива: збирач резолвить неймспейс саме за нею.
[[kv_namespaces]]
binding = "NEWSBOT"
id = "c5e7197bae234cdc953d451966db3991"

# Секрети сюди НЕ пишуться. Тільки так:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put WEBHOOK_SECRET
